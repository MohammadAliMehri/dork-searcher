[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dork-searcher"
version = "2.0.0"
description = "Multi-engine search-engine dork searcher for passive, zero-cost target discovery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []
keywords = ["dork", "recon", "osint", "search-engines", "discovery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.8"]

[project.scripts]
dork-search = "dork_search:main"

[tool.setuptools]
py-modules = ["dork_search"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
